{% if form.non_field_errors %}
<div class="alerta alerta-erro" role="alert">
  {% icone "circle-alert" %}
  <div>{% for erro in form.non_field_errors %}<div>{{ erro }}</div>{% endfor %}</div>
</div>
{% elif form.errors %}
<div class="alerta alerta-erro" role="alert">
  {% icone "circle-alert" %}
  <div>Revise os campos marcados abaixo.</div>
</div>
{% endif %}
